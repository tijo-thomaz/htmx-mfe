<section id="timeline" class="py-20 bg-yellow-50">
  <div class="container mx-auto px-6">
    <h2 class="text-4xl font-bold text-center mb-16">My Origin Story</h2>

    <div class="comic-timeline max-w-4xl mx-auto">
      <!-- Comic panels that reveal on scroll -->
      {{range .Timeline}}
      <div
        class="timeline-panel bg-white border-4 border-gray-900 p-6 mb-12 rounded-lg shadow-comic transform rotate-1 opacity-0"
      >
        <div class="comic-header flex justify-between items-center mb-4">
          <div
            class="year-badge bg-yellow-400 text-gray-900 font-bold py-1 px-4 rounded-full transform -rotate-3 -translate-y-8 -translate-x-2"
          >
            {{.Year}}
          </div>
          <div class="comic-dots flex space-x-1">
            <span class="w-3 h-3 bg-gray-900 rounded-full"></span>
            <span class="w-3 h-3 bg-gray-900 rounded-full"></span>
            <span class="w-3 h-3 bg-gray-900 rounded-full"></span>
          </div>
        </div>

        <h3 class="text-2xl font-bold mb-2">{{.Title}}</h3>
        <p class="text-gray-600 italic mb-4">{{.Subtitle}}</p>
        <p class="comic-text">{{.Description}}</p>

        <!-- Comic-style speech bubble -->
        <div
          class="speech-bubble bg-gray-100 border-2 border-gray-900 p-4 mt-6 rounded-lg relative"
        >
          <div
            class="absolute -top-3 -left-3 w-6 h-6 bg-gray-100 border-2 border-gray-900 transform rotate-45"
          ></div>
          <p class="text-gray-800 italic">
            "{{if .Quote}}{{.Quote}}{{else}}Every line of code tells a
            story!{{end}}"
          </p>
        </div>
      </div>
      {{end}}
    </div>

    <!-- HTMX Experience Capsule Button -->
    <div class="text-center mt-16">
      <h3 class="text-2xl font-bold mb-6">
        Unlock Special Experience Capsules
      </h3>
      <button
        hx-get="/fragment/devcapsule"
        hx-target="#capsule-zone"
        hx-swap="beforeend"
        hx-indicator="#capsule-loader"
        class="bg-blue-700 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-800 transform transition hover:scale-105 hover:-rotate-2"
      >
        ⚡ Load Experience Capsule
      </button>

      <!-- Loading indicator -->
      <div id="capsule-loader" class="htmx-indicator mt-4">
        <div
          class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-700"
        ></div>
      </div>

      <!-- Capsule container -->
      <div
        id="capsule-zone"
        class="mt-10 grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto"
      ></div>
    </div>
  </div>
</section>
