<section id="contact" class="py-20 bg-yellow-100">
  <div class="container px-6 mx-auto">
    <h2 class="mb-12 text-4xl font-bold text-center reveal-text">Summon Me</h2>

    <div class="max-w-2xl p-8 mx-auto bg-white rounded-lg shadow-lg">
      <div class="flex justify-center mb-8 hero-signal">
        <div
          class="flex items-center justify-center w-24 h-24 rounded-full bg-accent"
        >
          <svg
            class="w-12 h-12 text-white"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
            ></path>
          </svg>
        </div>
      </div>

      <form
        class="space-y-6"
        hx-post="/api/contact"
        hx-target="#form-response"
        hx-swap="outerHTML"
        hx-indicator=".htmx-indicator"
      >
        <div id="form-response"></div>

        <div>
          <label for="name" class="block mb-2 font-bold text-gray-700"
            >Name</label
          >
          <input
            type="text"
            id="name"
            name="name"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-accent"
            required
          />
        </div>

        <div>
          <label for="email" class="block mb-2 font-bold text-gray-700"
            >Email</label
          >
          <input
            type="email"
            id="email"
            name="email"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-accent"
            required
          />
        </div>

        <div>
          <label for="message" class="block mb-2 font-bold text-gray-700"
            >Message</label
          >
          <textarea
            id="message"
            name="message"
            rows="4"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-accent"
            required
          ></textarea>
        </div>

        <div>
          <button
            type="submit"
            class="w-full px-4 py-3 font-bold text-white transition rounded-lg bg-accent hover:bg-blue-700"
          >
            <span class="hidden htmx-indicator">
              <svg
                class="inline-block w-5 h-5 mr-3 -ml-1 text-white animate-spin"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
              Sending...
            </span>
            <span class="htmx-default">Send Message</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
