services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates
    environment:
      - PORT=8080
    restart: unless-stopped

  # React MFE service with script detection
  react-mfe:
    image: node:18-alpine
    working_dir: /app
    command: >
      sh -c "
        apk add --no-cache git &&
        git clone https://github.com/tijo-thomaz/portfolio-mfe.git /app &&
        npm install &&
        echo 'Available scripts:' &&
        npm run | grep -A 100 'Scripts available' &&
        if npm run | grep -q 'dev'; then
          npm run dev;
        elif npm run | grep -q 'serve'; then
          npm run serve;
        elif npm run | grep -q 'develop'; then
          npm run develop;
        else
          echo 'No suitable development script found';
          exit 1;
        fi
      "
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
